name: CI - Condiciones extremas en el clima de Costa Rica

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Instalar dependencias del sistema y paquetes de R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: true
          extra-packages: |
            any::tidyverse
            any::shiny
            any::rmarkdown
            any::quarto

      - name: Ejecutar script de R
        run: |
          Rscript cod/main.R